<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marina One — Design Proposal: Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;min-height:100vh;background:#03080f;display:flex;align-items:center;justify-content:center;overflow:hidden}

/* Background animado */
.bg-glow{position:fixed;inset:0;z-index:0}
.glow-1{position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(26,141,230,.18) 0%,transparent 70%);top:-100px;left:-100px;filter:blur(60px)}
.glow-2{position:absolute;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(20,184,166,.12) 0%,transparent 70%);bottom:-80px;right:-80px;filter:blur(80px)}
.glow-3{position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(99,102,241,.08) 0%,transparent 70%);top:40%;left:50%;transform:translate(-50%,-50%);filter:blur(60px)}

/* Grid marítimo sutil */
.bg-grid{position:fixed;inset:0;z-index:0;background-image:linear-gradient(rgba(26,141,230,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(26,141,230,.04) 1px,transparent 1px);background-size:40px 40px}

/* Onda decorativa */
.wave-bottom{position:fixed;bottom:0;left:0;right:0;z-index:0;opacity:.4}

.login-wrapper{position:relative;z-index:10;display:flex;align-items:center;justify-content:center;width:100%;padding:24px}

/* Card principal */
.login-card{
  width:400px;
  background:rgba(13,24,39,.7);
  border:1px solid rgba(255,255,255,.08);
  border-radius:24px;
  padding:44px 40px;
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  box-shadow:0 32px 80px rgba(0,0,0,.6),0 0 0 1px rgba(26,141,230,.06) inset;
  position:relative;
  overflow:hidden;
}

/* Linha de acento no topo */
.login-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent 0%,#1a8de6 35%,#14b8a6 65%,transparent 100%);
  opacity:.8;
}

/* Badge "Powered by" */
.powered-badge{
  position:absolute;top:20px;right:20px;
  font-size:9px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;
  color:rgba(255,255,255,.25);
  display:flex;align-items:center;gap:4px;
}
.powered-dot{width:5px;height:5px;border-radius:50%;background:linear-gradient(135deg,#1a8de6,#14b8a6)}

/* Logo */
.login-logo{text-align:center;margin-bottom:36px}
.logo-icon{
  width:64px;height:64px;border-radius:18px;
  background:linear-gradient(135deg,rgba(26,141,230,.2),rgba(20,184,166,.15));
  border:1px solid rgba(26,141,230,.25);
  display:inline-flex;align-items:center;justify-content:center;
  font-size:28px;margin-bottom:16px;
  box-shadow:0 8px 24px rgba(26,141,230,.2);
}
.logo-name{font-size:24px;font-weight:800;color:#f0f6ff;letter-spacing:-.5px;line-height:1}
.logo-sub{font-size:12px;color:rgba(255,255,255,.35);margin-top:5px;letter-spacing:.3px;font-weight:400}

/* Divider */
.section-label{
  font-size:10.5px;font-weight:600;letter-spacing:.6px;
  text-transform:uppercase;color:rgba(255,255,255,.3);
  text-align:center;margin-bottom:22px;
  display:flex;align-items:center;gap:12px;
}
.section-label::before,.section-label::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.07)}

/* Campos */
.field{margin-bottom:14px}
.field label{
  display:block;font-size:11px;font-weight:600;
  color:rgba(255,255,255,.4);letter-spacing:.4px;
  text-transform:uppercase;margin-bottom:7px;
}
.field input{
  width:100%;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);
  border-radius:12px;
  padding:13px 16px;
  color:#f0f6ff;
  font-size:14px;
  font-family:'Inter',sans-serif;
  outline:none;
  transition:all .2s;
}
.field input:focus{
  border-color:rgba(26,141,230,.5);
  background:rgba(26,141,230,.06);
  box-shadow:0 0 0 3px rgba(26,141,230,.12);
}
.field input::placeholder{color:rgba(255,255,255,.2)}

.field-icon{position:relative}
.field-icon input{padding-left:44px}
.field-icon .ico{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  font-size:15px;opacity:.3;
}

/* Botão principal */
.btn-login{
  width:100%;margin-top:22px;
  padding:14px 24px;
  background:linear-gradient(135deg,#1a8de6 0%,#1470c2 100%);
  color:#fff;
  font-size:14px;font-weight:600;
  border:none;border-radius:12px;
  cursor:pointer;
  position:relative;overflow:hidden;
  box-shadow:0 4px 20px rgba(26,141,230,.35),0 1px 0 rgba(255,255,255,.15) inset;
  transition:all .2s;
  font-family:'Inter',sans-serif;
  letter-spacing:.1px;
}
.btn-login::after{
  content:'';position:absolute;
  top:0;left:-100%;width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent);
}

/* Links */
.login-footer{
  margin-top:20px;
  display:flex;justify-content:space-between;align-items:center;
}
.link-forgot{
  font-size:12px;color:rgba(26,141,230,.7);
  text-decoration:none;font-weight:500;
}
.link-sa{
  font-size:11px;color:rgba(255,255,255,.2);
  text-decoration:none;font-weight:500;
  display:flex;align-items:center;gap:4px;
}

/* Status indicator */
.status-bar{
  margin-top:24px;padding-top:20px;
  border-top:1px solid rgba(255,255,255,.06);
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.status-dot{width:6px;height:6px;border-radius:50%;background:#10b981;box-shadow:0 0 8px rgba(16,185,129,.6);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.7;transform:scale(.85)}}
.status-text{font-size:11px;color:rgba(255,255,255,.25);letter-spacing:.2px}

/* Watermark fundo */
.watermark{
  position:absolute;bottom:-30px;right:-30px;
  font-size:120px;opacity:.015;
  font-weight:900;color:#fff;
  pointer-events:none;
  user-select:none;
}
</style>
</head>
<body>
<div class="bg-glow">
  <div class="glow-1"></div>
  <div class="glow-2"></div>
  <div class="glow-3"></div>
</div>
<div class="bg-grid"></div>

<div class="login-wrapper">
  <div class="login-card">
    <div class="powered-badge">
      <div class="powered-dot"></div>
      Marina One SaaS
    </div>

    <div class="watermark">⚓</div>

    <div class="login-logo">
      <div class="logo-icon">⚓</div>
      <div class="logo-name">Marina One</div>
      <div class="logo-sub">Sistema de Gestão de Marina</div>
    </div>

    <div class="section-label">Acesso à plataforma</div>

    <div class="field field-icon">
      <label>E-mail</label>
      <span class="ico">✉</span>
      <input type="email" placeholder="seu@email.com" value="admin@marinaone.com.br">
    </div>

    <div class="field field-icon">
      <label>Senha</label>
      <span class="ico">🔒</span>
      <input type="password" placeholder="••••••••" value="••••••••">
    </div>

    <button class="btn-login">Entrar na plataforma →</button>

    <div class="login-footer">
      <a class="link-forgot" href="#">Esqueci minha senha</a>
      <a class="link-sa" href="#">🔐 Admin SaaS</a>
    </div>

    <div class="status-bar">
      <div class="status-dot"></div>
      <span class="status-text">Servidor online · Seguro · v2.3.72</span>
    </div>
  </div>
</div>

</body>
</html>
