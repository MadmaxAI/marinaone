# ============================================================
#  Marina One — NGINX: roteamento multi-tenant por subdomínio
#  Cada marina acessa via: slug.marinaone.com.br
# ============================================================

# Mapa: extrai o slug do subdomínio
map $host $tenant_slug {
    default                   "";
    "~^(?<slug>[^.]+)\.marinaone\.com\.br$"  $slug;
}

# Rate limiting
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

server {
    listen 80;
    server_name *.marinaone.com.br marinaone.com.br;

    # Redireciona HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name *.marinaone.com.br marinaone.com.br;

    # Wildcard SSL (gerado via Cloudflare DNS-01 ou certbot)
    ssl_certificate     /etc/letsencrypt/live/marinaone.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marinaone.com.br/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Gzip
    gzip on;
    gzip_types text/html text/css application/json application/javascript;

    # Injeta X-Tenant-Slug para o Node.js resolver o tenant
    proxy_set_header X-Tenant-Slug $tenant_slug;
    proxy_set_header Host           $host;
    proxy_set_header X-Real-IP      $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # Rate limit nas rotas de API
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://localhost:3000;
    }

    # Frontend (sem rate limit)
    location / {
        proxy_pass http://localhost:3000;
    }
}
